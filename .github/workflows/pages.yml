name: Publicar

# Publica la app como sitio estático en GitHub Pages.
# Requiere una sola cosa en el repo: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar el sitio
        run: |
          # Sólo lo que la app necesita: ni tests, ni notas, ni capturas.
          mkdir -p _site/icons
          cp index.html data.js engine.js manifest.webmanifest sw.js LICENSE _site/
          cp icons/icon.svg icons/icon-192.png icons/icon-512.png \
             icons/icon-maskable-512.png icons/apple-touch-icon.png _site/icons/
          ls -R _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
