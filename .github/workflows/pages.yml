name: Publicar en GitHub Pages opcional

# ALTERNATIVA: la app se publica en https://scrachmo.vercel.app con Vercel.
# Este workflow queda para quien prefiera GitHub Pages en vez de Vercel.
# Requiere una sola cosa en el repo: Settings → Pages → Source: "GitHub Actions".
# Mientras no esté habilitado, el workflow termina en verde con un aviso: no
# tiene sentido marcar en rojo cada push por una configuración manual.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v5

      - name: "¿Pages está habilitado?"
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages")
          echo "respuesta de la API: $code"
          if [ "$code" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages todavía no está habilitado. Entrá a Settings → Pages → Source: GitHub Actions y volvé a correr este workflow."
          fi

      - name: Preparar el sitio
        if: steps.pages.outputs.ready == 'true'
        run: |
          # Sólo lo que la app necesita: ni tests, ni notas, ni capturas.
          mkdir -p _site/icons
          cp index.html app.html landing.js boot.js data.js engine.js \
             manifest.webmanifest sw.js vercel.json LICENSE _site/
          cp icons/icon.svg icons/icon-192.png icons/icon-512.png \
             icons/icon-maskable-512.png icons/apple-touch-icon.png _site/icons/
          ls -R _site

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.ready == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
